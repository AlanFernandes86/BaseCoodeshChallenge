services:
  accumulator:
    build:
      context: .
      dockerfile: OrderAccumulator/Dockerfile
    ports:
      - "9999:9999"
    volumes:
      - ./OrderAccumulator/store:/app/store
      - ./OrderAccumulator/log:/app/log
    networks:
      - fix-network
    environment:
      - LANG=pt_BR.UTF-8
      - LANGUAGE=pt_BR:pt
      - LC_ALL=pt_BR.UTF-8
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: OrderGenerator.Backend/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - accumulator
    networks:
      - fix-network
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - LANG=pt_BR.UTF-8
      - LANGUAGE=pt_BR:pt
      - LC_ALL=pt_BR.UTF-8
    volumes:
      - ./OrderGenerator.Backend/store:/app/store
      - ./OrderGenerator.Backend/log:/app/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: OrderGenerator.Frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - fix-network
    environment:
      # The browser makes requests from the user's machine, so use localhost:5000
      - VITE_API_URL=http://localhost:5000
    restart: unless-stopped

networks:
  fix-network:
    driver: bridge
